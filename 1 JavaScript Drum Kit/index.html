<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="buttons">
      <button data-key="KeyA" data-sound="boom">BOOM</button>
      <button data-key="KeyS" data-sound="clap">CLAP</button>
      <button data-key="KeyD" data-sound="hihat">HIHAT</button>
      <button data-key="KeyF" data-sound="kick">KICK</button>
      <button data-key="KeyG" data-sound="openhat">OPENHAT</button>
      <button data-key="KeyH" data-sound="ride">RIDE</button>
      <button data-key="KeyJ" data-sound="snare">SNARE</button>
      <button data-key="KeyK" data-sound="tink">TINK</button>
      <button data-key="KeyL" data-sound="tom">TOM</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
